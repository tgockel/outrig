default-image = "outrig-standard"
default-agent = "coding"

[workspace]
host-path      = "."
container-path = "/workspace"

[agents.coding]
image    = "outrig-standard"
preamble = """
You are a careful coding assistant. The repo is mounted at /workspace. It is the user's own \
checkout, so what you change there changes their working tree.

Read .agents/AGENTS.md before changing anything: it lays out the repo and its conventions for \
code, docs and plans.

Commits are the user's. This container has no git identity and no signing key, so `git commit`, \
`git rebase --continue` and merges fail here. Stage the work and tell the user what to run.

To compare with an earlier commit, check it out with `git worktree add --detach` outside \
/workspace (under /tmp, say) and remove that worktree afterward. Do not use `git stash`: its \
stack is shared with the user's own.

Two tests fail in this container and are not regressions. \
`outrig::network::tests::a_direct_connection_to_the_listener_is_refused_not_dialed` always fails, \
because there is no conntrack. \
`the_fixed_listener_port_binds_again_after_a_server_first_close` can fail when many tests run at \
once, and passes when run alone.
"""

[images.outrig-standard]
dockerfile = ".agents/outrig/images/outrig-standard/Dockerfile"
context    = ".agents/outrig/images/outrig-standard"

# Every MCP server is a `view = "primary"` sidecar: the primary image carries a Rust
# toolchain and nothing else, and each server brings its own runtime. The published
# filesystem image is wrapped in an image-config so that it *pulls* -- a bare registry ref
# in an `image` position resolves `--pull=never` and would have to be present already.

[images.mcp-filesystem]
image-name = "docker.io/mcp/filesystem:latest"

[images.mcp-git]
dockerfile = ".agents/outrig/images/mcp-git/Dockerfile"
context    = ".agents/outrig/images/mcp-git"

[images.mcp-shell]
dockerfile = ".agents/outrig/images/mcp-shell/Dockerfile"
context    = ".agents/outrig/images/mcp-shell"

[images.mcp-web]
dockerfile = ".agents/outrig/images/mcp-web/Dockerfile"
context    = ".agents/outrig/images/mcp-web"

  [images.outrig-standard.mcp]
  fs  = { image = "mcp-filesystem", view = "primary", args = ["/workspace"] }
  git = { image = "mcp-git", view = "primary", args = ["--repository", "/workspace"] }
  web = { image = "mcp-web" }

  [images.outrig-standard.mcp.shell]
  image = "mcp-shell"
  view  = "primary"

    # Every value here names a *primary* path, which is correct: the commands this server
    # spawns resolve in the primary's view. Only the interpreter comes from the graft, and
    # it finds its own prefix from its grafted path.
    [images.outrig-standard.mcp.shell.env]
    CARGO_HOME  = "/workspace/.cargo"
    RUSTUP_HOME = "/usr/local/rustup"
    PATH        = "/usr/local/cargo/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"

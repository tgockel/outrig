name: CI

on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  cargo:
    name: cargo (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: default,   cargo_args: "" }
          - { name: mistralrs, cargo_args: "--features outrig-cli/mistralrs" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo clippy --all-targets ${{ matrix.cargo_args }} -- -D warnings
      - run: cargo test ${{ matrix.cargo_args }}

  mdbook:
    name: mdbook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-mdbook
      - run: cargo install mdbook mdbook-mermaid --locked
      - run: mdbook build

  links:
    name: links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments 'doc/**/*.md' 'README.md' 'CONTRIBUTING.md'
          fail: true

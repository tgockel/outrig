name: CI

on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  cargo:
    name: cargo (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    env:
      # `crates/outrig/build.rs` degrades *every* launcher failure -- a missing
      # target, a launcher that stopped compiling, an unrunnable rustc -- to a
      # cargo warning plus an empty artifact, and `tests/enter_embedded.rs` has
      # a matching early-return, so none of it turns CI red on its own. This
      # makes the degradation a hard build error. Both musl targets are
      # installed below, so every row can satisfy it.
      OUTRIG_REQUIRE_ENTER: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          # The `e2e` feature has no row here. It used to have one, pinned at
          # `cargo test --no-run` because "the runner has no way to provide"
          # podman -- which was never true of the `ubuntu-24.04` images. The
          # `live-e2e` job below runs that suite against the engine the runner
          # already ships, so a compile-only row would only be a second, weaker
          # build of the same configuration.
          #
          # The arm64 row is the only place build.rs's `"aarch64" =>` arm is
          # taken: every other row is x86-64 and reaches AArch64 through the
          # cross-compile step below, which covers the launcher by itself and
          # nothing around it. This row builds the whole crate for the arch and
          # runs the suite there, so `tests/enter_embedded.rs` checks a
          # natively embedded helper. What *execs* that helper -- and so decides
          # whether `launcher.rs`'s AArch64 syscall numbers are right -- is the
          # aarch64 `live-e2e` row, not this one.
          #
          # `live-e2e (aarch64)` runs on the same label and its invocation is a
          # superset of this row's, so almost everything here is covered there
          # too. It stays anyway: it answers in minutes where that job answers
          # in fifteen, it fails independently of a live engine, and its `cargo
          # check` is the only place the published lib-and-bin-only shape is
          # compiled for AArch64 at all. What that costs is a duplicate cache
          # bucket, which plan/next/ci-configuration-coverage.md owns.
          - { name: default,   runner: ubuntu-latest,    cargo_args: "" }
          - { name: arm64,     runner: ubuntu-24.04-arm, cargo_args: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          # `crates/outrig/build.rs` compiles the `outrig-enter` launcher for
          # the runner's own arch -- x86-64 on most rows, AArch64 on the arm64
          # one -- and the cross-compile step below needs whichever is the
          # other. Installing both everywhere keeps the rows uniform.
          # `OUTRIG_REQUIRE_ENTER` above is what makes a launcher that will not
          # compile fail the build rather than warn.
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      # x86-64 only: nothing here sets `RUSTC_WRAPPER=sccache`, so this step
      # caches nothing on any row (see plan/next/ci-configuration-coverage.md,
      # which proposes wiring it up or dropping it). Until that is settled, keep
      # a no-op step off the arm64 runner rather than betting that a pinned
      # v0.0.3 resolves an aarch64 asset.
      - if: matrix.runner == 'ubuntu-latest'
        uses: mozilla-actions/sccache-action@v0.0.3
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          cache-on-failure: true
      - run: cargo clippy --all-targets ${{ matrix.cargo_args }} -- -D warnings
      # The shape `cargo install outrig-cli` builds: lib and bin only, so no
      # dev-dependencies and `internal-test-api` off. Every other step here
      # implies `--all-targets` or `test`, both of which pull dev-dependencies
      # and turn that feature on, so this is the only place the published
      # configuration gets compiled at all.
      - run: cargo check ${{ matrix.cargo_args }}
      # Strict rustdoc on the library, one row. Unlike the public-API snapshot this
      # depends on nothing that churns between nightlies -- a doc link either
      # resolves against the surface in this commit or it does not -- so it
      # belongs in per-PR CI rather than behind a pin. `--lib` deliberately:
      # rustdoc'ing the workspace collides the CLI's `outrig` bin target with
      # the library's `outrig` lib target onto one output path, which is a
      # separate problem (plan/next/workspace-rustdoc-output-collision.md) and
      # not one to solve by widening this. Private and unresolved links are
      # errors here because seven of them accumulated unnoticed while nothing
      # ran this.
      # Both libs, one target each: `outrig` renders to `outrig` and `outrig-cli` to
      # `outrig_cli`, so naming them separately avoids the collision a workspace-wide run
      # hits while still covering both published surfaces.
      - if: matrix.name == 'default'
        run: cargo rustdoc -p outrig --lib --locked -- -D warnings
      - if: matrix.name == 'default'
        run: cargo rustdoc -p outrig-cli --lib --locked -- -D warnings
      # The library against musl's headers, where `msghdr`/`cmsghdr` length
      # fields are `socklen_t` rather than glibc's `size_t` -- `nsfork.rs` is
      # the only code that touches them, and nothing else here would notice it
      # naming one. The target is installed above for the launcher, and the
      # library's dependency tree needs no C cross-toolchain, unlike the
      # binary's (aws-lc-sys). One row is enough: the difference is the libc,
      # not the feature set.
      - if: matrix.name == 'default'
        run: cargo check -p outrig --target x86_64-unknown-linux-musl
      # Cross-compile the standalone launcher as AArch64: a cargo build on this
      # row only ever exercises the x86-64 branch in build.rs, and the cross is
      # the leg that breaks -- the host `cc` cannot link foreign-arch
      # objects, which is why build.rs passes `-C linker=rust-lld`. These flags
      # mirror that invocation exactly; a divergence here would validate a
      # command the build never issues. `file -b` drops the path from the
      # output, without which `aarch64` matches the filename and the check
      # passes for any architecture.
      - if: matrix.name == 'default'
        run: |
          rustc --edition 2024 --target aarch64-unknown-linux-musl \
            -C linker=rust-lld -C opt-level=2 -C panic=abort -C strip=symbols \
            -o "$RUNNER_TEMP/outrig-enter-aarch64" \
            crates/outrig/src/container/enter/launcher.rs
          file -b "$RUNNER_TEMP/outrig-enter-aarch64" | grep -q 'ARM aarch64'
      - run: cargo test ${{ matrix.cargo_args }}
      # `outrig`'s seal test, gated out of the line above on purpose: trybuild
      # compiles the crate's dev dependency graph again in a scratch target
      # directory of its own, which no row shares with any other. One row pays
      # it, and the arm64 row would prove nothing extra -- the seal is a
      # property of the type system, not of the target.
      - if: matrix.name == 'default'
        run: cargo test -p outrig --features seal-tests --test compile_fail

  # The e2e suite, executed. Every other job in this file proves the tree
  # compiles; this is the only one that puts outrig in front of a container
  # engine, which is the only thing that can answer what a cancelled build left
  # behind, whether a `detach` really cut its bridges, or whether a forged SNI
  # is refused by an interceptor rather than by a unit test's idea of one.
  #
  # Two rows, one invocation. Both runner images ship the same engine --
  # podman 4.9.3 and buildah 1.33.7 -- so a difference between the rows is a
  # difference in the architecture, which is the question the aarch64 row
  # exists to ask. The labels are pinned rather than `ubuntu-latest`: this job
  # is evidence about a specific engine, and `ubuntu-latest` moves to 26.04
  # (podman 5.7.0) on a schedule of its own.
  #
  # The aarch64 row is the first thing anywhere to *exec* the `outrig-enter`
  # launcher built for AArch64, so it is what decides whether the syscall
  # numbers in `crates/outrig/src/container/enter/launcher.rs` are right.
  live-e2e:
    name: live-e2e (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    # Generous, but not the six-hour default: the suite does real builds and
    # real cancellations, and a hung engine should free the slot rather than
    # hold it all afternoon.
    timeout-minutes: 75
    env:
      # `view = "primary"` sidecars need the embedded musl launcher, and
      # `build.rs` degrades a launcher it cannot compile to a warning plus an
      # empty artifact. Without this the primary-view tests would fail as a
      # missing helper rather than the row failing as a missing target.
      OUTRIG_REQUIRE_ENTER: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86-64,  runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: live-e2e-${{ matrix.arch }}
          cache-on-failure: true
      # The environment this row's evidence is about, in the log beside it. A
      # pass means nothing without the engine version it passed against, and
      # these are the versions quoted in the task record and in `README.md`.
      - name: Record the engine
        run: |
          uname -srm
          podman --version
          buildah --version
          nft --version
          podman info --format '{{.Host.Security.Rootless}} {{.Store.GraphDriverName}}'
      # The e2e targets' own lint gate. It was the load-bearing half of the old
      # compile-only row -- `cargo clippy --all-targets` type-checks every e2e
      # target, so reintroduced bit-rot fails here in seconds rather than after
      # the suite has built and started pulling images.
      - run: cargo clippy --all-targets --features outrig/e2e,outrig-cli/e2e -- -D warnings
      # Written out in full rather than assembled from matrix fields, so that
      # "we ran the e2e suite" means one thing on both machines. Both crates
      # declare `e2e`; qualifying it per package is what keeps either suite
      # from silently staying out.
      - run: cargo test --workspace --locked --features outrig/e2e,outrig-cli/e2e

  public-api:
    name: public-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `cargo install` below needs a compiler, and `Swatinem/rust-cache` needs a `rustc -vV`
      # to key on. Stable deliberately: this row installs the *tool*, while the pinned nightly
      # the tool reads rustdoc with is installed by the script, from the manifest.
      - uses: dtolnay/rust-toolchain@stable
      # Caches `target/public-api`, where the script points `cargo rustdoc`. It is a separate
      # tree from the `cargo` job's `target/debug` because that one belongs to stable and this
      # one to a pinned nightly; sharing it would buy a full rebuild in both directions.
      #
      # `workspaces` has to name that tree. The script sets `CARGO_TARGET_DIR` on the child it
      # spawns, not on this job, so the default `. -> target` would key and prune the wrong
      # directory and the nightly's artifacts would be rebuilt every run.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-public-api
          workspaces: ". -> target/public-api"
          # The action keys on the *default* toolchain's `rustc -vV` -- which is the stable
          # installed above, while everything in this tree is built by the pinned nightly --
          # and on the member manifests and lockfile, none of which is the virtual root
          # `Cargo.toml` the pins live in. So a nightly bump alone would leave the key
          # unchanged: the job would restore the old compiler's artifacts, rebuild them, and
          # then skip saving because the lookup was an exact hit, every run until something
          # else moved. Hashing the root manifest in gives a pin bump a cache to populate.
          key: ${{ hashFiles('Cargo.toml') }}
      # `cargo-public-api` installs into a version-stamped directory under `~/.cache`, neither
      # `~/.cargo/bin` nor `target/`. Not `~/.cargo/bin`, because the same script runs on a
      # developer's machine, where replacing a global install is not ours to do. Not `target/`,
      # because `Swatinem/rust-cache` deletes loose files anywhere under the target directory
      # before saving, so the binary would be recompiled on every single run. Bumping the pin
      # renames the directory, so an older restored cache simply misses.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/outrig/public-api-tools
          key: v0-public-api-tool-${{ hashFiles('Cargo.toml') }}
          restore-keys: v0-public-api-tool-
      # The pinned nightly and the pinned `cargo-public-api` live in
      # `[workspace.metadata.public-api]` in the root `Cargo.toml` and are deliberately not
      # repeated here. A version in this file and a version in that table is the
      # two-places-to-look problem that left the committed snapshots carrying `core::io`
      # renderings from an unrecorded nightly, indistinguishable from real surface moves.
      #
      # `--install-missing` is the only difference from what a developer runs. It is off by
      # default so the script never downloads a toolchain and spends minutes compiling a tool
      # unasked; a runner is disposable, so it asks.
      #
      # No musl targets and no `OUTRIG_REQUIRE_ENTER`, unlike the `cargo` job: the embedded
      # `outrig-enter` launcher is a build artifact, not part of either crate's public surface.
      - run: python3 scripts/check-public-api.py --install-missing
      # Needs neither the toolchain nor the tool: it mutates the committed snapshot in memory,
      # one `pub fn` removed and one added, and checks that the comparison rejects both and
      # names what moved. Last, so a clean diff above is never the only evidence that the
      # comparison is capable of failing at all.
      - run: python3 scripts/check-public-api.py --self-test

  package:
    name: package
    runs-on: ubuntu-latest
    env:
      # The whole point of this job. `crates/outrig/build.rs` compiles the `outrig-enter`
      # launcher out of the crate's own sources at build time, and degrades a failure --
      # including sources that are not there -- to a cargo warning plus an empty artifact.
      # So a `cargo publish` whose archive was missing `src/container/enter/launcher.rs`
      # would verify-build green and ship a binary whose `view = "primary"` sidecars all
      # fail at session start. This variable makes that degradation a hard error, and
      # `cargo package` applies it to the *packaged* archive rather than the working tree,
      # which is the copy nothing else here builds.
      OUTRIG_REQUIRE_ENTER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: cargo package --locked -p outrig -p outrig-cli

  doc-style:
    name: doc-style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/audit-doc-style.py

  mdbook:
    name: mdbook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-mdbook
      - run: cargo install mdbook mdbook-mermaid --locked
      - run: mdbook build

  links:
    name: links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments 'doc/**/*.md' 'README.md' 'CONTRIBUTING.md' 'SECURITY.md' 'CODE_OF_CONDUCT.md' 'RELEASING.md'
          fail: true

name: CI

on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  cargo:
    name: cargo (${{ matrix.name }})
    runs-on: ubuntu-latest
    env:
      # `crates/outrig/build.rs` degrades *every* launcher failure -- a missing
      # target, a launcher that stopped compiling, an unrunnable rustc -- to a
      # cargo warning plus an empty artifact, and `tests/enter_embedded.rs` has
      # a matching early-return, so none of it turns CI red on its own. This
      # makes the degradation a hard build error. Both musl targets are
      # installed below, so every row can satisfy it.
      OUTRIG_REQUIRE_ENTER: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          # The e2e row is a compile gate. Its tests drive real podman, which
          # the runner has no way to provide, so `test_args` pins them at
          # `--no-run`: they must build, never run. The other rows pass "" and
          # run their tests as before. Features are package-qualified to match
          # the local-llm row's style, not out of necessity -- Cargo fans an
          # unqualified `--features e2e` out to every member declaring it.
          - { name: default,   cargo_args: "", test_args: "" }
          - { name: local-llm, cargo_args: "--features outrig-cli/local-llm", test_args: "" }
          - { name: e2e,       cargo_args: "--features outrig/e2e,outrig-cli/e2e", test_args: "--no-run" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          # `crates/outrig/build.rs` compiles the `outrig-enter` launcher for
          # the runner's own arch; AArch64 is for the cross-compile step below.
          # `OUTRIG_REQUIRE_ENTER` above is what makes a launcher that will not
          # compile fail the build rather than warn.
          targets: x86_64-unknown-linux-musl,aarch64-unknown-linux-musl
      - uses: mozilla-actions/sccache-action@v0.0.3
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          cache-on-failure: true
      - run: cargo clippy --all-targets ${{ matrix.cargo_args }} -- -D warnings
      # The shape `cargo install outrig-cli` builds: lib and bin only, so no
      # dev-dependencies and `internal-test-api` off. Every other step here
      # implies `--all-targets` or `test`, both of which pull dev-dependencies
      # and turn that feature on, so this is the only place the published
      # configuration gets compiled at all.
      - run: cargo check ${{ matrix.cargo_args }}
      # The library against musl's headers, where `msghdr`/`cmsghdr` length
      # fields are `socklen_t` rather than glibc's `size_t` -- `nsfork.rs` is
      # the only code that touches them, and nothing else here would notice it
      # naming one. The target is installed above for the launcher, and the
      # library's dependency tree needs no C cross-toolchain, unlike the
      # binary's (aws-lc-sys). One row is enough: the difference is the libc,
      # not the feature set.
      - if: matrix.name == 'default'
        run: cargo check -p outrig --target x86_64-unknown-linux-musl
      # Cross-compile the standalone launcher as AArch64: a cargo build on this
      # runner only ever exercises the x86-64 branch in build.rs, and the cross
      # is the leg that breaks -- the host `cc` cannot link foreign-arch
      # objects, which is why build.rs passes `-C linker=rust-lld`. These flags
      # mirror that invocation exactly; a divergence here would validate a
      # command the build never issues. `file -b` drops the path from the
      # output, without which `aarch64` matches the filename and the check
      # passes for any architecture.
      - if: matrix.name == 'default'
        run: |
          rustc --edition 2024 --target aarch64-unknown-linux-musl \
            -C linker=rust-lld -C opt-level=2 -C panic=abort -C strip=symbols \
            -o "$RUNNER_TEMP/outrig-enter-aarch64" \
            crates/outrig/src/container/enter/launcher.rs
          file -b "$RUNNER_TEMP/outrig-enter-aarch64" | grep -q 'ARM aarch64'
      - run: cargo test ${{ matrix.cargo_args }} ${{ matrix.test_args }}

  doc-style:
    name: doc-style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/audit-doc-style.py

  mdbook:
    name: mdbook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-mdbook
      - run: cargo install mdbook mdbook-mermaid --locked
      - run: mdbook build

  links:
    name: links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments 'doc/**/*.md' 'README.md' 'CONTRIBUTING.md' 'SECURITY.md' 'CODE_OF_CONDUCT.md' 'RELEASING.md'
          fail: true

# Mirror of doc/reference/config.md "Full examples", flattened into one file
# so the schema fixture exercises every legal section in a single round-trip.

default-image      = "coding"
default-agent      = "coding"
default-model      = "fast"
session-root       = "/var/lib/outrig/sessions"
tool-call-max      = 100
tool-result-max    = 524288
subagent-depth-max = 4
subagent-width-max = 6
retry-budget-secs  = 300

[network]
mode = "audit"

[providers.openai]
style                = "openai"
base-url             = "https://api.openai.com/v1"
api-key              = "${OPENAI_API_KEY}"
request-timeout-secs = 90
retry-budget-secs    = 120

[providers.anthropic]
style    = "anthropic"
base-url = "https://api.anthropic.com"
api-key  = "${ANTHROPIC_API_KEY}"

[providers.local]
style    = "openai"
base-url = "http://127.0.0.1:11434/v1"
api-key  = "${OLLAMA_API_KEY}"

[models.fast]
provider   = "openai"
identifier = "gpt-4o-mini"

[models.smart]
provider   = "openai"
identifier = "gpt-4o"

[models.claude]
provider   = "anthropic"
identifier = "claude-sonnet-4-6"
max-tokens = 16384

[models.local-fast]
provider   = "local"
identifier = "qwen3:4b"

# One name for one model: repoint this line and every agent naming `opus`
# follows, with no other edit.
[models.opus]
alias = "claude"

# One name for a set of equivalents, in preference order. The first candidate
# this build is credentialed for wins.
[models.any-fast]
alias = ["fast", "local-fast"]

[agents.coding]
image              = "coding"
preamble           = "You are a careful coding assistant. Repo is at /workspace."
temperature        = 0.2
max-tokens         = 4096
tool-call-max      = 300
tool-result-max    = 1048576
subagent-depth-max = 2
subagent-width-max = 3

[agents.review]
model    = "smart"
preamble = "You are a meticulous code reviewer."

[workspace]
host-path      = "."
container-path = "/workspace"

[[workspace.mounts]]
host-path      = ".agents/outrig/resources/docs"
container-path = "/resources/docs"

[[workspace.mounts]]
host-path      = ".agents/outrig/resources/cache"
container-path = "/resources/cache"
access         = "read-write"

[images.coding]
dockerfile = ".agents/outrig/images/coding/Dockerfile"
context    = ".agents/outrig/images/coding"
build-args = { NODE_VERSION = "20" }

  [images.coding.security]
  capability-profile = "no-net-raw"
  cap-drop = ["MKNOD", "SETFCAP"]
  cap-add  = ["NET_BIND_SERVICE"]
  no-new-privileges = false
  devices  = ["/dev/fuse"]
  unmask   = ["/proc/*"]

  [images.coding.mcp]
  shell = ["bash", "-lc", "exec shell-mcp-command"]
  fs    = { command = ["mcp-server-filesystem", "/workspace"] }
  build = { command = ["cargo-mcp"], env = { CARGO_HOME = "/workspace/.cargo" } }
  grep  = { command = ["mcp-grep"], image = "ghcr.io/example/mcp-grep:1" }
  lint  = { command = ["mcp-lint", "--stdio"], sidecar = "tools" }

# Sidecars are top level: declared once, referenced by name from any
# image-config, and started only for the ones whose `[mcp]` entries name them.
[sidecars.tools]
image      = "mcp-tools"
workspace  = "ro"
start      = "auto"
on-failure = "warn"

  [[sidecars.tools.mounts]]
  host-path      = ".agents/outrig/resources/cache"
  container-path = "/cache"
  access         = "read-write"

  [sidecars.tools.security]
  capability-profile = "no-net-raw"
  devices            = ["/dev/fuse"]
  unmask             = ["/proc/*"]

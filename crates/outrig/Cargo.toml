[package]
name        = "outrig"
description = "Run LLM agents with podman-isolated MCP servers (library crate)."
build       = "build.rs"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
readme                  = "README.md"
homepage.workspace      = true
documentation.workspace = true
repository.workspace    = true
keywords.workspace      = true
categories.workspace    = true
# A generated record of the published API, for review; of no use to a consumer.
# The test that reads it has to travel with it: it is ungated, so shipping the
# test without its input turns `cargo test` in an unpacked or vendored package
# into a missing-file panic. Excluding both keeps the check strict in the repo,
# where a snapshot that has gone missing is exactly what it should catch.
exclude                 = ["public-api.txt", "tests/public_api_boundary.rs"]

[features]
e2e = []
# `tests/compile_fail.rs` only. trybuild builds its cases in a scratch project
# with a target directory of its own, so running it compiles this crate's whole
# dev dependency graph a second time -- ~2 GB, and `build.rs`'s musl launcher
# again with it. Behind a feature so an ordinary `cargo test` does not pay that,
# and so the CI matrix pays it on one row rather than three; the step is in
# `.github/workflows/ci.yml`.
seal-tests = []

[[test]]
name              = "library_surface"
required-features = ["e2e"]

[[test]]
name              = "compile_fail"
required-features = ["seal-tests"]

[dependencies]
anyhow             = { workspace = true, features = ["std"] }
async-stream       = { workspace = true }
axum               = { workspace = true, features = ["http1", "tokio"] }
blake3             = { workspace = true, features = ["std"] }
bytes              = { workspace = true, features = ["std"] }
futures-util       = { workspace = true, features = ["std", "async-await", "async-await-macro"] }
heck               = { workspace = true }
ignore             = { workspace = true }
jiff               = { workspace = true, features = ["std", "tz-system", "tzdb-bundle-platform", "tzdb-zoneinfo"] }
nix                = { workspace = true, features = ["user", "fs", "process", "signal", "net", "uio"] }
rand               = { workspace = true, features = ["std", "std_rng", "thread_rng"] }
regex              = { workspace = true, features = ["std", "perf", "unicode"] }
# The agent loop's; private, so no rig or reqwest type reaches the public surface.
reqwest            = { workspace = true, features = ["rustls"] }
rig                = { workspace = true, features = ["reqwest", "rustls"] }
rmcp               = { workspace = true, features = ["base64", "client", "macros", "server", "transport-child-process", "transport-io", "transport-streamable-http-server"] }
ruzstd             = { workspace = true, features = ["std"] }
schemars           = { workspace = true, features = ["derive"] }
serde              = { workspace = true, features = ["std", "derive"] }
serde_json         = { workspace = true, features = ["std"] }
tar                = { workspace = true }
tempfile           = { workspace = true, features = ["getrandom"] }
thiserror          = { workspace = true }
tokio              = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "io-std", "net", "process", "signal", "fs", "time", "sync"] }
tokio-util         = { workspace = true }
toml               = { workspace = true, features = ["display", "parse", "serde"] }
tracing            = { workspace = true, features = ["std", "attributes"] }
tracing-subscriber = { workspace = true, features = ["std", "fmt", "ansi", "tracing-log", "smallvec", "env-filter"] }
walkdir            = { workspace = true }

# `build.rs` fetches, verifies, and embeds the static CPython every session
# mounts, and the pure-Python wheels unpacked beside it; see
# `src/python/archive.rs`, which it shares with this crate's tests. A wheel's
# members are deflated, which `miniz_oxide` inflates at build time, so the
# runtime unpacks a tar as it unpacks the payload; it also deflates the two
# Python programs behind the `-c` bootstrap each is passed as.
[build-dependencies]
miniz_oxide = { workspace = true, features = ["with-alloc"] }
ruzstd      = { workspace = true, features = ["std"] }
sha2        = { workspace = true }
tar         = { workspace = true }
ureq        = { workspace = true, features = ["rustls"] }

[dev-dependencies]
# `archive.rs`'s tests build a synthetic wheel to convert.
miniz_oxide = { workspace = true, features = ["with-alloc"] }
# `resource` starts the interpreter under a memory ceiling of the test's choosing.
nix      = { workspace = true, features = ["resource"] }
reqwest  = { workspace = true, features = ["json", "rustls"] }
sha2     = { workspace = true }
# `test-util` pauses the clock so the interceptor's sniff window can be driven
# deterministically rather than slept through.
tokio    = { workspace = true, features = ["test-util"] }
toml     = { workspace = true, features = ["display", "parse", "serde"] }
# Behind the `seal-tests` feature above. It is the sole way to assert that an
# out-of-crate `impl IoPathExt` is rejected *by the seal* and not by the orphan
# rules, which a snapshot line cannot distinguish. Cargo builds every
# dev-dependency whatever features are on -- optional ones are not allowed here
# -- but trybuild's own graph is three small crates; the cost the feature gates
# is the scratch build its cases trigger at run time.
trybuild = { workspace = true }

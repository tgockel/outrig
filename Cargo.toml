[package]
name = "outrig"
version = "0.1.0"
edition = "2024"

[features]
default   = []
e2e       = []
mistralrs = ["dep:mistralrs-core", "dep:hf-hub", "dep:candle-core", "dep:indexmap", "dep:reqwest"]

[dependencies]
anyhow             = "1.0"
blake3             = "1.5"
candle-core        = { version = "=0.10.2", optional = true, default-features = false }
clap               = { version = "4.5", features = ["derive"] }
dialoguer          = { version = "0.12", features = ["fuzzy-select"] }
directories        = "5.0"
heck               = "0.5"
hf-hub             = { version = "=0.4.3", optional = true, default-features = false }
ignore             = "0.4"
indexmap           = { version = "2.14", optional = true }
jiff               = "0.2"
mistralrs-core     = { version = "=0.8.1", optional = true, default-features = false }
nix                = { version = "0.29", features = ["user"] }
rand               = "0.8"
regex              = "1.10"
reqwest            = { version = "0.12", optional = true, default-features = false, features = ["json", "rustls-tls"] }
rig-core           = { version = "0.36", default-features = false, features = ["reqwest", "rustls"] }
serde              = { version = "1.0", features = ["derive"] }
serde_json         = "1.0"
tempfile           = "3.10"
thiserror          = "1.0"
toml               = "0.8"
toml_edit          = "0.22"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
walkdir            = "2.5"

[dependencies.rmcp]
version = "0.1"
default-features = false
features = [
    "base64",
    "client",
    "macros",
    "server",
    "transport-child-process",
    "transport-io",
]

[dependencies.tokio]
version = "1.40"
features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    "io-std",
    "process",
    "signal",
    "fs",
    "time",
    "sync",
]

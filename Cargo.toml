regex              = { version = "1.12.4",  default-features = false }
reqwest            = { version = "0.13.4",  default-features = false }
rig                = { version = "0.40.0",  default-features = false, package = "rig-core" }
rmcp               = { version = "3.1.0",   default-features = false }
schemars           = { version = "1.2.2",   default-features = false }
serde              = { version = "1.0.229", default-features = false }
serde_json         = { version = "1.0.151", default-features = false }
tempfile           = { version = "3.27.0",  default-features = false }
thiserror          = { version = "2.0.19",  default-features = false }
tokio              = { version = "1.53.1",  default-features = false }

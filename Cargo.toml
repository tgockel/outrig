[workspace]
resolver = "2"
members  = ["crates/outrig", "crates/outrig-cli"]

[workspace.package]
version       = "0.1.0"
edition       = "2024"
license       = "Apache-2.0"
homepage      = "https://tgockel.github.io/outrig/"
documentation = "https://tgockel.github.io/outrig/"
repository    = "https://github.com/tgockel/outrig"

[workspace.dependencies]
anyhow             = { version = "1.0",     default-features = false }
async-stream       = { version = "0.3",     default-features = false }
axum               = { version = "0.8",     default-features = false }
blake3             = { version = "1.5",     default-features = false }
candle-core        = { version = "=0.10.2", default-features = false }
clap               = { version = "4.5",     default-features = false }
dialoguer          = { version = "0.12",    default-features = false }
directories        = { version = "5.0",     default-features = false }
futures-util       = { version = "0.3",     default-features = false }
heck               = { version = "0.5",     default-features = false }
hf-hub             = { version = "=0.4.3",  default-features = false }
ignore             = { version = "0.4",     default-features = false }
indexmap           = { version = "2.14",    default-features = false }
jiff               = { version = "0.2",     default-features = false }
mistralrs-core     = { version = "=0.8.1",  default-features = false }
nix                = { version = "0.29",    default-features = false }
rand               = { version = "0.8",     default-features = false }
regex              = { version = "1.10",    default-features = false }
reqwest            = { version = "0.12",    default-features = false }
rig-core           = { version = "0.36",    default-features = false }
rmcp               = { version = "1.6",     default-features = false }
schemars           = { version = "0.8",     default-features = false }
serde              = { version = "1.0",     default-features = false }
serde_json         = { version = "1.0",     default-features = false }
tempfile           = { version = "3.10",    default-features = false }
thiserror          = { version = "1.0",     default-features = false }
tokio              = { version = "1.40",    default-features = false }
toml               = { version = "0.8",     default-features = false }
toml_edit          = { version = "0.22",    default-features = false }
tracing            = { version = "0.1",     default-features = false }
tracing-subscriber = { version = "0.3",     default-features = false }
tokio-util         = { version = "0.7",     default-features = false }
walkdir            = { version = "2.5",     default-features = false }

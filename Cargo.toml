[package]
name = "outrig"
version = "0.1.0"
edition = "2024"

[features]
default = []
e2e = []

[dependencies]
anyhow             = "1.0"
blake3             = "1.5"
clap               = { version = "4.5", features = ["derive"] }
dialoguer          = "0.11"
directories        = "5.0"
ignore             = "0.4"
jiff               = "0.2"
nix                = { version = "0.29", features = ["user"] }
rand               = "0.8"
regex              = "1.10"
rig-core           = { version = "0.36", default-features = false, features = ["reqwest", "rustls"] }
serde              = { version = "1.0", features = ["derive"] }
serde_json         = "1.0"
tempfile           = "3.10"
thiserror          = "1.0"
toml               = "0.8"
toml_edit          = "0.22"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
walkdir            = "2.5"

[dependencies.rmcp]
version = "0.1"
default-features = false
features = [
    "base64",
    "client",
    "macros",
    "transport-child-process",
]

[dependencies.tokio]
version = "1.40"
features = [
    "rt-multi-thread",
    "macros",
    "io-util",
    "process",
    "signal",
    "fs",
    "time",
]

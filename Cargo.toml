[workspace]
resolver = "2"
members  = ["crates/outrig", "crates/outrig-cli"]

[workspace.package]
version       = "0.1.0"
edition       = "2024"
rust-version  = "1.87"
license       = "Apache-2.0"
authors       = ["Travis Gockel <travis@gockelhut.com>"]
homepage      = "https://tgockel.github.io/outrig/"
documentation = "https://tgockel.github.io/outrig/"
repository    = "https://github.com/tgockel/outrig"
keywords      = ["llm", "agent", "mcp", "podman", "sandbox"]
categories    = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
anyhow             = { version = "1.0.102", default-features = false }
async-stream       = { version = "0.3.6",   default-features = false }
axum               = { version = "0.8.9",   default-features = false }
blake3             = { version = "1.8.5",   default-features = false }
candle-core        = { version = "=0.10.2", default-features = false }
clap               = { version = "4.6.1",   default-features = false }
dialoguer          = { version = "0.12.0",  default-features = false }
directories        = { version = "6.0.0",   default-features = false }
futures-util       = { version = "0.3.32",  default-features = false }
heck               = { version = "0.5.0",   default-features = false }
hf-hub             = { version = "=0.5.0",  default-features = false }
ignore             = { version = "0.4.26",  default-features = false }
indexmap           = { version = "2.14.0",  default-features = false }
jiff               = { version = "0.2.29",  default-features = false }
mistralrs-core     = { version = "=0.8.1",  default-features = false }
nix                = { version = "0.31.3",  default-features = false }
rand               = { version = "0.10.1",  default-features = false }
regex              = { version = "1.12.4",  default-features = false }
reqwest            = { version = "0.13.4",  default-features = false }
rig                = { version = "0.39.0",  default-features = false, package = "rig-core" }
rmcp               = { version = "1.8.0",   default-features = false }
schemars           = { version = "1.2.1",   default-features = false }
serde              = { version = "1.0.228", default-features = false }
serde_json         = { version = "1.0.150", default-features = false }
tempfile           = { version = "3.27.0",  default-features = false }
thiserror          = { version = "2.0.18",  default-features = false }
tokio              = { version = "1.52.3",  default-features = false }
toml               = { version = "1.1.2",   default-features = false }
toml_edit          = { version = "0.25.12", default-features = false }
tracing            = { version = "0.1.44",  default-features = false }
tracing-subscriber = { version = "0.3.23",  default-features = false }
tokio-util         = { version = "0.7.18",  default-features = false }
walkdir            = { version = "2.5.0",   default-features = false }

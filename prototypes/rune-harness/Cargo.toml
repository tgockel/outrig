[package]
name = "outrig-rune-harness-prototype"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "rune-harness-scripted"
path = "src/bin/scripted.rs"

[[bin]]
name = "outrig-harness"
path = "src/bin/outrig-harness.rs"

[dependencies]
anyhow = "=1.0.104"
async-trait = "0.1"
clap = { version = "=4.6.4", features = ["derive"] }
outrig = { path = "../../crates/outrig" }
outrig-cli = { path = "../../crates/outrig-cli", features = ["internal-test-api"] }
rig = { package = "rig-core", version = "=0.40.0", default-features = false, features = ["reqwest", "rustls"] }
rune = { git = "https://github.com/rune-rs/rune", rev = "1a423577a9813406043bea15da25714eccadf37d" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.19"
tokio = { version = "=1.53.1", features = ["macros", "rt", "io-std", "io-util", "sync", "time"] }

[dev-dependencies]
tempfile = "3"

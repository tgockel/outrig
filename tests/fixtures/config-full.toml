# Mirror of doc/reference/config.md "Full examples", flattened into one file
# so the schema fixture exercises every legal section in a single round-trip.

default-container = "coding"
default-agent     = "coding"
default-model     = "fast"
session-root      = "/var/lib/outrig/sessions"
model-cache-root  = "/var/cache/outrig/models"
tool-call-cap     = 100
tool-result-cap   = 524288

[providers.openai]
style                = "openai"
base-url             = "https://api.openai.com/v1"
api-key              = "${OPENAI_API_KEY}"
request-timeout-secs = 90

[providers.anthropic]
style    = "openai"
base-url = "https://api.anthropic.com/v1"
api-key  = "${ANTHROPIC_API_KEY}"

[providers.local]
style = "mistralrs"

[models.fast]
provider   = "openai"
identifier = "gpt-4o-mini"

[models.smart]
provider   = "openai"
identifier = "gpt-4o"

[models.claude]
provider   = "anthropic"
identifier = "claude-sonnet-4-6"

[models.phi3-fast]
provider   = "local"
model-id   = "microsoft/Phi-3-mini-4k-instruct-gguf"
model-file = "Phi-3-mini-4k-instruct-q4.gguf"

[models.llama-local]
provider       = "local"
model-path     = ".agents/outrig/models/llama-3-8b-instruct.q4.gguf"
context-length = 4096

[agents.coding]
container   = "coding"
preamble    = "You are a careful coding assistant. Repo is at /workspace."
temperature = 0.2
max-tokens  = 4096
tool-call-cap = 300
tool-result-cap = 1048576

[agents.review]
model    = "smart"
preamble = "You are a meticulous code reviewer."

[workspace]
host-path      = "."
container-path = "/workspace"

[[workspace.mounts]]
host-path      = ".agents/outrig/resources/docs"
container-path = "/resources/docs"

[[workspace.mounts]]
host-path      = ".agents/outrig/resources/cache"
container-path = "/resources/cache"
access         = "read-write"

[containers.coding]
dockerfile = ".agents/outrig/containers/coding/Dockerfile"
context    = ".agents/outrig/containers/coding"
build-args = { NODE_VERSION = "20" }

  [containers.coding.security]
  capability-profile = "no-net-raw"
  cap-drop = ["MKNOD", "SETFCAP"]
  cap-add  = ["NET_BIND_SERVICE"]

  [containers.coding.mcp]
  shell = ["bash", "-lc", "exec shell-mcp-command"]
  fs    = { command = ["mcp-server-filesystem", "/workspace"] }
  build = { command = ["cargo-mcp"], env = { CARGO_HOME = "/workspace/.cargo" } }
